name: Studio browser smoke tests

on:
  pull_request:
    paths:
      - 'site/**'
      - 'studio/**'
      - '.github/workflows/studio-smoke-tests.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/studio-smoke-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/smoke-test.mjs
      - name: Install isolated browser test runtime
        run: |
          TEST_DIR="${RUNNER_TEMP}/studio-browser-tests"
          mkdir -p "$TEST_DIR"
          npm install --prefix "$TEST_DIR" --no-save --package-lock=false --ignore-scripts playwright
          "$TEST_DIR/node_modules/.bin/playwright" install --with-deps chromium
          cp site/smoke-test.mjs "$TEST_DIR/smoke-test.mjs"
          cp studio/smoke-test.mjs "$TEST_DIR/studio-smoke-test.mjs"
      - name: Serve static app
        run: |
          python3 -m http.server 4173 --directory site > /tmp/studio-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/studio-http.log
          exit 1
      - name: Test real browser interactions
        run: node "${RUNNER_TEMP}/studio-browser-tests/smoke-test.mjs"
      - name: Build Magnanimous Preact Studio
        run: |
          npm install --prefix studio --no-audit --no-fund
          npm run build --prefix studio
      - name: Serve Preact Studio production build
        run: |
          npm run preview --prefix studio -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/preact-studio.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/preact/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/preact-studio.log
          exit 1
      - name: Test all Studio tools and mobile layout
        env:
          STUDIO_URL: http://127.0.0.1:4174/preact/
        run: node "${RUNNER_TEMP}/studio-browser-tests/studio-smoke-test.mjs"
