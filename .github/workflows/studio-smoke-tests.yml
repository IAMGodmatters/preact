name: Studio browser smoke tests

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/studio-smoke-tests.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/studio-smoke-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve static app
        run: |
          python3 -m http.server 4173 --directory site > /tmp/studio-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/studio-http.log
          exit 1
      - name: Test real browser interactions
        run: node site/smoke-test.mjs
