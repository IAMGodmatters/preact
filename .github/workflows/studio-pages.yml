name: Build and publish Magnanimous Preact Studio

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/studio-pages.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: true

jobs:
  pages-preflight:
    name: Verify GitHub Pages is enabled before building
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      page_url: ${{ steps.check.outputs.page_url }}
    steps:
      - name: Check Pages site configuration
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              if (data.build_type !== 'workflow') {
                core.setFailed(
                  'GitHub Pages exists but is not configured for GitHub Actions. Open Settings → Pages → Build and deployment → Source and select GitHub Actions.'
                );
                return;
              }
              core.setOutput('page_url', data.html_url);
              core.info(`GitHub Pages is enabled for Actions: ${data.html_url}`);
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(
                  'GitHub Pages is disabled or unavailable for this repository. No build was started, preventing the late deploy-pages HTTP 404. Enable it once at Settings → Pages → Build and deployment → Source → GitHub Actions, then rerun this workflow.'
                );
                return;
              }
              throw error;
            }

  build:
    needs: pages-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: studio
        run: npm install --no-audit --no-fund
      - name: Build production site
        working-directory: studio
        run: npm run build
      - name: Verify Pages output before upload
        working-directory: studio
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q '<title>Magnanimous Preact Studio</title>' dist/index.html
          grep -q '/preact/assets/' dist/index.html
          echo "Studio HTML and repository-base asset paths verified."
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: studio/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ needs.pages-preflight.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [pages-preflight, build]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and built assets
        env:
          SITE_URL: ${{ needs.pages-preflight.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}/"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$SITE_URL" -o /tmp/studio-index.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Published Studio URL did not become reachable after 12 attempts: $SITE_URL"
              exit 1
            fi
            sleep 5
          done
          grep -q '<title>Magnanimous Preact Studio</title>' /tmp/studio-index.html
          asset_path="$(grep -oE 'src="/preact/[^"]+\.js"' /tmp/studio-index.html | head -n 1 | cut -d '"' -f 2)"
          if [ -z "$asset_path" ]; then
            echo "::error::Published HTML does not reference the expected /preact/ JavaScript bundle."
            exit 1
          fi
          curl --fail --silent --show-error --location "${SITE_URL%/}${asset_path}" -o /dev/null
          echo "Published Studio HTML and JavaScript bundle are reachable."
